<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230B1120' stroke='%23F59E0B' stroke-width='6'/><path d='M35 50 A 15 15 0 1 1 65 50 A 15 15 0 1 1 35 50 Z' fill='none' stroke='%23FF8A00' stroke-width='8'/><circle cx='50' cy='50' r='6' fill='%23F59E0B'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF9F00" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Casjoe Local AI | Offline Business AI - Built for Africa</title>
    <meta name="description" content="Casjoe Local AI brings enterprise-grade AI to affordable laptops across Africa completely offline. No internet required, no API costs, 100% data privacy." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              casjoe: {
                bg: '#060913',
                sidebar: '#070B15',
                card: '#0C1222',
                gold: '#FF9F00',
                orange: '#FF6B00'
              }
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Casjoe AI SW registered:', reg.scope))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
